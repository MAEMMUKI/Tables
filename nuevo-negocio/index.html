<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Granjita</title><meta name="theme-color" content="#ffffff"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@500;600;700&display=swap"><style>*{box-sizing:border-box}html{min-height:100%;background:#000000}body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#f5f5f5;min-height:100%}
.top{background:#ffffff;color:#1b1b22;padding:36px 20px 60px;text-align:center}

.lg.img{background:#ffffff;padding:8px}
.lg.img.libre{background:transparent;padding:0;width:auto;height:96px;border-radius:0}
.lg img{width:100%;height:100%;object-fit:contain;display:block}
.lg.libre img{width:auto;max-width:240px;height:96px}

.it.main{background:#ffffff;color:#1b1b22;border-color:#ffffff}

.it.txt{font-weight:400}.it em{font-weight:400;font-size:12px;opacity:.7}
